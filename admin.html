<!DOCTYPE html>
<html lang="ja" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A-Mashiro — 画像管理パネル</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="admin-header">
  <div class="logo">A-Mashiro <span>管理パネル</span></div>
  <button id="btn-settings" class="btn-ghost">接続設定</button>
</header>

<div id="settings-panel" class="panel hidden">
  <h2>GitHubリポジトリへの接続</h2>
  <p class="hint">
    この情報は、サイトをホストしているGitHubリポジトリに変更を直接保存するために使われます。
    トークンはこのブラウザにのみ保存され、他には送信されません。誰にも共有しないでください。
  </p>
  <label>ユーザー名 / 組織名 (owner)
    <input id="cfg-owner" type="text" placeholder="例: a-mashiro-art">
  </label>
  <label>リポジトリ名 (repository)
    <input id="cfg-repo" type="text" placeholder="例: a-mashiro-ar">
  </label>
  <label>ブランチ (branch)
    <input id="cfg-branch" type="text" value="main">
  </label>
  <label>Personal Access Token
    <input id="cfg-token" type="password" placeholder="github_pat_xxxxxxxxxxxxxxxx">
  </label>
  <div class="row">
    <button id="btn-save-settings" class="btn-primary">設定を保存</button>
    <button id="btn-forget-settings" class="btn-ghost">このブラウザからトークンを削除</button>
  </div>
</div>

<div class="admin-body">
  <nav class="section-nav">
    <div class="section-nav-title">セクション</div>
    <button class="sec-btn" data-key="home">ホーム（スライドショー）</button>
    <button class="sec-btn" data-key="about">ABOUT（写真）</button>
    <div class="section-nav-title">作品</div>
    <button class="sec-btn" data-key="works">Selected Works</button>
    <button class="sec-btn" data-key="s1121">11-21</button>
    <button class="sec-btn" data-key="memories">Memories Deep in The Heart</button>
    <button class="sec-btn" data-key="primitives">Primitives</button>
    <button class="sec-btn" data-key="misalignment">Misalignment</button>
    <button class="sec-btn" data-key="window">Window of Enlightenment</button>
    <button class="sec-btn" data-key="dots2">2dots</button>
    <button class="sec-btn" data-key="paintingover">Painting Over</button>
    <button class="sec-btn" data-key="ginga">Ginga</button>
    <button class="sec-btn" data-key="collaboration">Collaboration</button>
  </nav>

  <main class="section-main">
    <div id="no-section" class="empty-hint">左のメニューからセクションを選んでください。</div>

    <div id="section-editor" class="hidden">
      <h2 id="section-title"></h2>
      <p class="hint">画像をここにドラッグ&ドロップ、またはクリックして選択してください。カードをドラッグすると並び替えできます。変更は「保存して公開」を押すまで反映されません。</p>

      <div id="dropzone" class="dropzone">
        <span>画像をここにドロップ、またはクリックして選択</span>
        <input id="file-input" type="file" accept="image/*" multiple hidden>
      </div>

      <div id="card-list" class="card-list"></div>

      <div class="row save-row">
        <button id="btn-save" class="btn-primary">保存して公開</button>
        <span id="status-msg" class="status-msg"></span>
      </div>
    </div>
  </main>
</div>

<script src="admin.js"></script>
</body>
</html>
